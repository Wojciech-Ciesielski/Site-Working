name: Boxy

# Zasady boxów i kontenerów (boxes/README.md): zależności, cykle, kontenery, pliki, paths: workflow.
# Bez filtra paths: każda zmiana w repo może złamać zasady (np. plik poza boxes/).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: boxes/shrimp-box } }
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - run: cargo run --locked -q -- check
