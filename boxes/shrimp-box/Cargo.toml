[package]
name = "shrimp-box"
version = "0.1.0"
edition = "2021"
description = "Shrimp: boxy (kod + box.toml) i kontenery (worki boxów): sprawdzanie, kolejność, budowanie"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.2"

[profile.release]
strip = true
